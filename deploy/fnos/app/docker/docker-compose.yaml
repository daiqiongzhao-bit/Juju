services:
  juju:
    image: daiqiongzhao/juju:0.0.27
    container_name: juju
    restart: unless-stopped
    ports:
      # 宿主机端口来自安装向导（wizard_port），容器内固定 3000
      - "${wizard_port}:3000"
    env_file:
      - /var/apps/juju/etc/juju.env
    volumes:
      # 数据库与上传文件：飞牛运行时数据目录（TRIM_PKGVAR，升级保留/卸载可选清除）
      - "${TRIM_PKGVAR}/data:/data"
      # 每日自动备份（保留最近 7 份）
      - "${TRIM_PKGVAR}/backups:/backups"
